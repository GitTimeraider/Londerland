ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Config, databases and logs inside the data volume must never be served directly
<Directory /var/www/html/data>
    <FilesMatch "\.(db|db-journal|db-wal|sqlite|log)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/data/config>
    Require all denied
</Directory>
# AI Chat uploads are only served through the API, which checks the owner
<Directory /var/www/html/data/aichat>
    Require all denied
</Directory>

# Browser caching of static files. Files linked with ?v=<commit> change their address with every
# update, so browsers may keep them for a year; other static files (tab icons, fonts, images) for a day.
<Directory /var/www/html>
    <FilesMatch "\.(css|js|mjs|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=86400"
        Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=/"
    </FilesMatch>
</Directory>
