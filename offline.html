<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="robots" content="noindex">
	<title>Offline</title>
	<style>
		:root {
			color-scheme: dark light;
			--bg: #1f2329;
			--card: #2b2f36;
			--text: #e8eaed;
			--muted: #a0a6ad;
			--accent: #2cabe3;
		}
		@media (prefers-color-scheme: light) {
			:root {
				--bg: #f3f4f6;
				--card: #ffffff;
				--text: #1f2329;
				--muted: #5f6670;
			}
		}
		html, body {
			height: 100%;
			margin: 0;
		}
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			box-sizing: border-box;
			background: var(--bg);
			color: var(--text);
			font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		}
		main {
			max-width: 420px;
			width: 100%;
			padding: 32px 24px;
			border-radius: 12px;
			background: var(--card);
			text-align: center;
			box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
		}
		.icon {
			font-size: 48px;
			line-height: 1;
		}
		h1 {
			margin: 16px 0 8px;
			font-size: 22px;
		}
		p {
			margin: 0 0 24px;
			color: var(--muted);
		}
		button {
			padding: 10px 24px;
			border: 0;
			border-radius: 6px;
			background: var(--accent);
			color: #fff;
			font: inherit;
			cursor: pointer;
		}
		button:focus-visible {
			outline: 2px solid var(--text);
			outline-offset: 2px;
		}
	</style>
</head>
<body>
	<main>
		<div class="icon" aria-hidden="true">📡</div>
		<h1>You are offline</h1>
		<p>The server cannot be reached right now. Check your connection and try again.</p>
		<button type="button" onclick="location.reload()">Try again</button>
	</main>
	<script>
		// Back as soon as the connection is
		window.addEventListener('online', function () {
			location.reload();
		});
	</script>
</body>
</html>
