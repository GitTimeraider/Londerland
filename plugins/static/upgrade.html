<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Upgrading...</title>
    <link href="../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="../../css/dark.min.css" rel="stylesheet">
    <link href="../../css/colors/default.css" id="theme" rel="stylesheet">
</head>
<body>
<!-- Preloader -->

<section id="wrapper" class="error-page">
    <div class="error-box">
        <div class="error-body text-center">
            <h1 class="text-info">Upgrading</h1>
            <h3 class="text-uppercase">Please wait while we update Londerland for you...</h3>
            <p class="text-muted my-4 text-uppercase">This page will auto-refresh in <span
                    id="countdown"></span> second(s)</p>
        </div>

    </div>
</section>
<script>
    var time_left = 10;
    var cinterval;

    function time_dec() {
        time_left--;
        document.getElementById('countdown').innerHTML = time_left;
        if (time_left == 0) {
            local('s', 'message', 'Upgrade Complete|Thank you!');
            document.getElementById('countdown').innerHTML = time_left;
            window.location.replace("../../");
            clearInterval(cinterval);
        }
    }

    function localStorageSupport() {
        return (('localStorage' in window) && window['localStorage'] !== null)
    }

    function local(type, key, value = null) {
        if (localStorageSupport) {
            switch (type) {
                case 'set':
                case 's':
                    localStorage.setItem(key, value);
                    break;
                case 'get':
                case 'g':
                    return localStorage.getItem(key);
                    break;
                case 'remove':
                case 'r':
                    localStorage.removeItem(key);
                    break;
                default:
                    console.warn('Londerland Function: localStorage action not defined');
            }
        }
    }

    cinterval = setInterval(time_dec, 1000);


</script>


</body>
</html>
