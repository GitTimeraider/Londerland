ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Config, databases and logs inside the data volume must never be served directly
<Directory /var/www/html/data>
    <FilesMatch "\.(db|db-journal|db-wal|sqlite|log)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/data/config>
    Require all denied
</Directory>
