version: 2
updates:
  # PHP dependencies (api/composer.json + composer.lock)
  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
    # Also the packages that the listed libraries pull in themselves, which is where most security fixes land
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  # Frontend libraries (package.json + package-lock.json)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Also the packages that the listed libraries pull in themselves, which is where most security fixes land
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile (php, composer, node)
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
