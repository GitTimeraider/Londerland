version: 2
updates:
  # PHP dependencies (api/composer.json + composer.lock)
  - package-ecosystem: composer
    directory: /api
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  # Frontend libraries (package.json + package-lock.json)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile (php, composer, node)
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      # Stay on PHP 8.5.x (patch releases only); moving to a new minor version is a manual step
      - dependency-name: php
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
