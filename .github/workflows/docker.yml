name: Docker image

# Changes that only touch text files (README and other Markdown, the license) do not build an image.
# Version tags always build.
on:
  push:
    branches: [master, develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base images (php, node, composer) come from Docker Hub, which rate-limits anonymous pulls per runner IP
      # (429 Too Many Requests). Logged-in pulls get their own, higher limit. Skipped when the secrets are not set.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/londerland
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Pull requests (including Dependabot) only build for amd64 to verify the image; nothing is pushed
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LONDERLAND_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
